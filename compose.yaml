x-common-env: &common-env
  env_file:
    - .env            # path is relative to the compose file

services:
  db:
    <<: *common-env
    build: ./db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    <<: *common-env
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]

  proxy:
    <<: *common-env
    build: ./proxy
    ports:
      - "${PROXY_PORT:-80}:80"   # interpolated from root .env
    depends_on: [api]
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true   # optional: no outbound internet access for api/db via this network

volumes:
  db_data:
