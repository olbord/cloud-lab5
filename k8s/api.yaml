apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-$ENV
spec:
  replicas: $REPLICAS
  selector:
    matchLabels:
      app: api
      env: $ENV
  template:
    metadata:
      labels:
        app: api
        env: $ENV
    spec:
      containers:
        - name: service
          image: $IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-$ENV, key: password}
            - name: DATABASE_URL
              value: postgres://app:$(DB_PASSWORD)@db-$ENV:5432/appdb
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-$ENV
spec:
  selector:
    app: api
    env: $ENV
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-$ENV
spec:
  rules:
    - host: $HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-$ENV
                port:
                  number: 80
