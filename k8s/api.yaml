apiVersion: v1
kind: Service
metadata:
  name: db-$ENV
spec:
  clusterIP: None
  selector:
    app: db
    env: $ENV
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-$ENV
spec:
  serviceName: db-$ENV
  replicas: 1
  selector:
    matchLabels:
      app: db
      env: $ENV
  template:
    metadata:
      labels:
        app: db
        env: $ENV
    spec:
      containers:
        - name: postgres
          image: $DB_IMAGE
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-$ENV, key: password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "appdb"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
